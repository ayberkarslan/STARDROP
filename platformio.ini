[platformio]
default_envs = esp32dev

; Varsayılan donanım: klasik ESP32 DevKit V1.
; GPIO18/19 boot-strapping veya USB-UART pinleri değildir.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; CP2102 tabanlı DevKit V1'lerde 921600 baud bazı USB bağlantılarında kararsızdır.
upload_speed = 115200
build_flags =
    ; SWD sinyalleri
    -D SWD_CLK_PIN=18
    -D SWD_DIO_PIN=19
    ; Nihai aviyonik bağlantı: yalnız SWCLK + SWDIO (ortak GND düzlemi).
    -D STM32_RST_PIN=-1
    -D ONBOARD_LED_PIN=2

; ESP32-S3 N16R8 için hazır alternatif.
; `pio run -e esp32-s3-n16r8 -t upload` ile seçilir.
[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D SWD_CLK_PIN=4
    -D SWD_DIO_PIN=5
    -D STM32_RST_PIN=6
    -D ONBOARD_LED_PIN=48

; Projenin ilk denemesinde kullanılan C3 SuperMini de korunuyor.
[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D SWD_CLK_PIN=20
    -D SWD_DIO_PIN=21
    -D STM32_RST_PIN=3
    -D ONBOARD_LED_PIN=8
