[package]
name = "stardrop-workbench"
version = "0.1.0"
description = "STARDROP avionics hardware validation workbench"
authors = ["Yildiz Rocket Team"]
edition = "2021"

[lib]
name = "stardrop_workbench_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "3.6"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "form", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
