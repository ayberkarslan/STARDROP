name: Build custom diagnostic profile
run-name: stardrop-${{ inputs.request_id }}-${{ inputs.test_id }}

on:
  workflow_dispatch:
    inputs:
      test_id:
        description: Catalog test identifier
        required: true
        type: string
      component_ref:
        description: Selected sensor reference designator
        required: true
        type: string
      request_id:
        description: Client correlation UUID
        required: true
        type: string
      profile_json:
        description: Normalized, approved BoardProfile JSON only
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate selected test
        env:
          TEST_ID: ${{ inputs.test_id }}
        run: node --input-type=module -e "const c=JSON.parse(await (await import('node:fs/promises')).readFile('catalog/catalog.json')); const t=c.tests.find(x=>x.id===process.env.TEST_ID); if(!t||t.status!=='ready') throw Error('Test not buildable');"
      - name: Validate BoardProfile
        env:
          PROFILE_JSON: ${{ inputs.profile_json }}
        run: node tools/validate-profile.mjs "$PROFILE_JSON"
      - name: Verify shared diagnostic runtime
        run: cmake -S . -B build && cmake --build build && ctest --test-dir build --output-on-failure
      - name: Install ARM GCC
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi
      - name: Generate pin-specific firmware
        env:
          TEST_ID: ${{ inputs.test_id }}
          PROFILE_JSON: ${{ inputs.profile_json }}
          COMPONENT_REF: ${{ inputs.component_ref }}
        run: |
          printf '%s' "$PROFILE_JSON" > profile-input.json
          node tools/build-firmware.mjs profile-input.json "$COMPONENT_REF" "$TEST_ID" out
      - uses: actions/upload-artifact@v4
        with:
          name: stardrop-firmware-${{ inputs.request_id }}
          path: |
            out/*.bin
            out/artifact.json
          retention-days: 14
